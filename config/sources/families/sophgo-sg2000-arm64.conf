# Sophgo SG2000/SG2002/CV1812H family - ARM64 mode
#
# These are dual-architecture chips (RISC-V or ARM Cortex-A53, selectable via hardware switch)
# This family configuration is for ARM64 mode (Cortex-A53 core).
# For RISC-V mode, see sophgo-sg2000-riscv64.conf
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="sophgo-sg2000-arm64"
declare -g GOVERNOR="performance"

# ARM64 compiler
declare -g KERNEL_COMPILER="aarch64-linux-gnu-"
declare -g UBOOT_COMPILER="aarch64-linux-gnu-"

# Boot configuration
# The vendor U-Boot uses FIT images and extlinux
declare -g SRC_EXTLINUX="yes"

# U-Boot - Skip compilation, use vendor bootloader from SD card
# Mainline U-Boot doesn't yet support SG2000
# The vendor bootloader must be pre-installed on the SD card (first partition)
# or flashed from the official Milkv Duo S SD card image
declare -g BOOTCONFIG="none"

# Kernel
case "${BRANCH}" in

	current)
		# Mainline kernel 6.18 with Sophgo support
		# Device tree patch: https://lore.kernel.org/sophgo/20251011014811.28521-1-josh.milas@gmail.com/
		declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
		declare -g KERNELBRANCH="tag:v6.18"
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g LINUXCONFIG="linux-sophgo-sg2000-arm64-current"
		declare -g KERNELPATCHDIR="sophgo-sg2000-arm64-${BRANCH}"
		declare -g EXTRAWIFI="no" # Limited RAM, skip extra WiFi drivers
		;;

esac

# Default serial console
declare -g SERIALCON="ttyS0"

# Image settings
# The SG2000 uses a specific partition layout with vendor boot loader
function pre_prepare_partitions() {
	declare -g OFFSET="4"
	declare -g IMAGE_PARTITION_TABLE="msdos"
	declare -g BOOTSIZE="256" # Keep boot partition small due to limited storage
}

# Write Sophgo fip.bin bootloader to SD card raw sectors
# The fip.bin contains FSBL + OpenSBI + U-Boot combined
# It must be written to raw sectors starting at sector 1 (after MBR)
function write_uboot_platform() {
	local blobs_dir="${1}"
	local device="${2}"
	local fip_blob=""

	# Check for fip.bin in the u-boot package directory (passed as $1)
	if [[ -f "${blobs_dir}/fip.bin" ]]; then
		fip_blob="${blobs_dir}/fip.bin"
	elif [[ -f "${blobs_dir}/fip-arm64.bin" ]]; then
		fip_blob="${blobs_dir}/fip-arm64.bin"
	fi

	if [[ -n "${fip_blob}" && -f "${fip_blob}" ]]; then
		display_alert "Writing Sophgo fip.bin" "${fip_blob} -> ${device}" "info"
		# Write fip.bin starting at sector 1 (skip MBR at sector 0)
		# This matches the Sophgo/Milkv SDK layout
		dd if="${fip_blob}" of="${device}" bs=512 seek=1 conv=notrunc,fsync status=none
		display_alert "Sophgo bootloader" "Written successfully" "info"
	else
		display_alert "WARNING" "Sophgo fip.bin blob not found" "wrn"
		display_alert "The image requires manual bootloader installation" "" "wrn"
		display_alert "See packages/blobs/sophgo/milkv-duos/README.md" "" "info"
	fi
}

# Post family configuration tweaks
function post_family_config__sophgo_sg2000_arm64() {
	display_alert "Sophgo SG2000 ARM64" "Applying family configuration" "info"
}

# Custom kernel config function
function custom_kernel_config__sophgo_sg2000_arm64_kernel() {
	if [[ -f .config ]]; then
		display_alert "Sophgo SG2000 ARM64" "Customizing kernel config" "info"

		# Enable Sophgo SoC support (ARM64 platform)
		kernel_config_set_y CONFIG_ARCH_SOPHGO

		# Enable required drivers for SG2000
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_CV1800B
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_CV1812H
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_SG2000
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_SG2002

		# Clock driver
		kernel_config_set_y CONFIG_CLK_SOPHGO_CV1800

		# DMA
		kernel_config_set_y CONFIG_DW_AXI_DMAC
		kernel_config_set_y CONFIG_SOPHGO_CV1800B_DMAMUX

		# Ethernet
		kernel_config_set_y CONFIG_STMMAC_ETH
		kernel_config_set_y CONFIG_STMMAC_PLATFORM
		kernel_config_set_y CONFIG_DWMAC_SOPHGO

		# Serial
		kernel_config_set_y CONFIG_SERIAL_8250
		kernel_config_set_y CONFIG_SERIAL_8250_CONSOLE
		kernel_config_set_y CONFIG_SERIAL_8250_DW

		# MMC/SD
		kernel_config_set_y CONFIG_MMC
		kernel_config_set_y CONFIG_MMC_SDHCI
		kernel_config_set_y CONFIG_MMC_SDHCI_PLTFM
		kernel_config_set_y CONFIG_MMC_CQHCI

		# GPIO
		kernel_config_set_y CONFIG_GPIO_DWAPB

		# I2C
		kernel_config_set_y CONFIG_I2C_DESIGNWARE_PLATFORM

		# SPI
		kernel_config_set_y CONFIG_SPI_DESIGNWARE
		kernel_config_set_y CONFIG_SPI_DW_MMIO

		# RTC
		kernel_config_set_y CONFIG_RTC_DRV_CV1800

		# ADC
		kernel_config_set_y CONFIG_SOPHGO_CV1800B_ADC

		# Sophgo SoC specific
		kernel_config_set_y CONFIG_SOPHGO_CV1800_RTCSYS

		# USB
		kernel_config_set_y CONFIG_USB_DWC2
		kernel_config_set_y CONFIG_USB_DWC2_DUAL_ROLE

		# Mailbox
		kernel_config_set_y CONFIG_CV1800_MBOX

		# Disable modules to reduce size (limited RAM/storage)
		kernel_config_set_n CONFIG_MODULES || true
	fi
}

# Kernel helpers
function kernel_config_set_y() {
	local option="$1"
	if grep -q "^# ${option} is not set" .config 2>/dev/null; then
		sed -i "s/^# ${option} is not set/${option}=y/" .config
	elif ! grep -q "^${option}=" .config 2>/dev/null; then
		echo "${option}=y" >> .config
	fi
}

function kernel_config_set_n() {
	local option="$1"
	if grep -q "^${option}=" .config 2>/dev/null; then
		sed -i "s/^${option}=.*$/# ${option} is not set/" .config
	fi
}
