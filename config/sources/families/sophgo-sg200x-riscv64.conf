# Sophgo SG2000 / SG2002 (CV181x) family - RISC-V mode
#
# These SoCs pair a T-Head C906 RISC-V core with an ARM Cortex-A53; which one
# runs Linux is decided by the FSBL inside fip.bin, not by anything Linux does.
# This family covers the RISC-V side. For ARM mode see sophgo-sg200x-arm64.conf.
#
# The SoC description itself lives in arch/riscv/boot/dts/sophgo/cv180x.dtsi
# and cv181x.dtsi and is shared by both architectures, so both families apply
# the very same kernel patch series (see patch/kernel/sophgo-sg200x-common).
#

declare -g ARCH="riscv64"
declare -g LINUXFAMILY="sophgo-sg200x-riscv64"
declare -g GOVERNOR="performance"

declare -g KERNEL_COMPILER="riscv64-linux-gnu-"

# Ubuntu moved its riscv64 baseline to the RVA23 profile in 25.10, and RVA23
# mandates Zba, Zbb, Zbs and more. The C906 in the SG2000 is plain RV64GC and
# has none of them, so an Ubuntu 25.10-or-later userspace cannot run here at
# all: the dynamic linker reaches a Zba instruction (sh3add) and PID 1 dies
# before anything else happens.
#
#   init[1]: unhandled signal 4 code 0x1 ... in ld-linux-riscv64-lp64d.so.1
#   ... cause: 0000000000000002        <- illegal instruction
#   Kernel panic - not syncing: Attempted to kill init! exitcode=0x00000004
#
# The kernel is fine and boots to that point; it correctly reports the ISA as
# "acdfim" with no Zba. Nothing on the Armbian side can fix it - the userspace
# is built for a CPU this board does not have. Debian's riscv64 baseline is
# still RV64GC, so Debian releases work.
#
# Fail during configuration rather than after a full image build and a serial
# console session. Only the RISC-V family needs this; the Cortex-A53 side runs
# any arm64 userspace.
function extension_prepare_config__sophgo_sg200x_riscv_reject_rva23_userspace() {
	[[ "${DISTRIBUTION}" == "Ubuntu" ]] || return 0

	# Compare by config/distributions/<release>/order rather than by name, so a
	# future Ubuntu is caught too - which is the entire point of the guard.
	# questing (25.10) is order 11 and is the first RVA23 release. The orders
	# interleave Debian and Ubuntu, hence the DISTRIBUTION check above.
	declare order_file="${SRC}/config/distributions/${RELEASE}/order"
	declare order=0
	[[ -r "${order_file}" ]] && order="$(cat "${order_file}")"
	[[ "${order}" =~ ^[0-9]+$ ]] || order=0

	if [[ "${order}" -ge 11 ]]; then
		display_alert "Milk-V Duo S" "RELEASE=${RELEASE} is Ubuntu 25.10 or newer" "err"
		display_alert "Milk-V Duo S" "its riscv64 userspace needs RVA23; the C906 is RV64GC" "err"
		exit_with_error "Ubuntu ${RELEASE} cannot boot on ${BOARD}" \
			"use a Debian release (trixie), or Ubuntu noble"
	fi
}

# Bootloader: built from source, like the ARM family.
#
# The SG200x BootROM only loads fip.bin from the FAT partition at the start of
# the card, and mainline U-Boot has no SG2000 support worth the name, so a
# vendor fip.bin is unavoidable. What we do here is build every part of it: the
# vendor U-Boot 2021.10, OpenSBI for the monitor slot, and the FSBL that packs
# them together. Details in the include below.
declare -g BOOTSOURCE="https://github.com/sophgo/u-boot-2021.10"
declare -g BOOTDIR="u-boot-sophgo-sg200x"
declare -g BOOTBRANCH="commit:bb7496c2dfded43921695bf49c23da28381f8960" # sg200x-dev, 2026-06-30
declare -g BOOTPATCHDIR="u-boot-sophgo-sg200x"

# The FSBL consumes u-boot.bin, so it cannot be built by compile_atf() - that
# runs before u-boot. It is built from uboot_custom_postprocess() instead, and
# so is OpenSBI, which has to see u-boot's device tree.
declare -g ATFSOURCE="none"

# That vendor U-Boot is patched for distroboot, so it finds and parses
# /extlinux/extlinux.conf on the first bootable partition by itself.
declare -g SRC_EXTLINUX="yes"

# Identifies the duo-buildroot-sdk-v2 project whose board files we vendored.
# See packages/sophgo-sg200x/u-boot/README.md.
declare -g SOPHGO_CVI_PROJECT="sg2000_milkv_duos_musl_riscv64_sd"
declare -g SOPHGO_CVI_BOARD="milkv_duos_musl_riscv64_sd"
declare -g SOPHGO_CVI_CHIP="sg2000"
declare -g SOPHGO_CVI_CHIP_ARCH="CV181X"
declare -g SOPHGO_CVI_DDR_CFG="ddr3_1866_x16"
declare -g SOPHGO_CVI_STORAGE="sd"
declare -g SOPHGO_CVI_PANEL="MIPI_panel_milkv_8hd"
declare -g SOPHGO_CVI_FILES_VARIANT="riscv64"
declare -g SOPHGO_CVI_UBOOT_DTS_DIR="arch/riscv/dts"
# "riscv", not "riscv64": both the SDK's CONFIG_ARCH and the FSBL Makefile's
# 'ifeq ($(ARCH),riscv)' expect the short name, and the FSBL falls back to
# aarch64 for anything else.
declare -g SOPHGO_CVI_UBOOT_ARCH="riscv"
declare -g SOPHGO_FSBL_ARCH="riscv"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_uboot.inc"

# Kernel: mainline plus the out-of-tree Sophgo patch series.
case "${BRANCH}" in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.0"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-edge"
		# CV1800B DMA support is not upstream until 7.1; backport it here.
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-dmac-7.0"
		;;

	bleedingedge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-bleedingedge"
		declare -g KERNELPATCHDIR="sophgo-sg200x-common"
		;;

esac

# The AIC8800 Wi-Fi module is handled by the sophgo-aic8800 extension, and
# 512MB of RAM does not leave room to build the rest of Armbian's WiFi drivers.
declare -g EXTRAWIFI="no"

declare -g SERIALCON="ttyS0"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
