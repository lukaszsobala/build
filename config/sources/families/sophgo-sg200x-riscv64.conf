# Sophgo SG2000 / SG2002 (CV181x) family - RISC-V mode
#
# These SoCs pair a T-Head C906 RISC-V core with an ARM Cortex-A53; which one
# runs Linux is decided by the FSBL inside fip.bin, not by anything Linux does.
# This family covers the RISC-V side. For ARM mode see sophgo-sg200x-arm64.conf.
#
# The SoC description itself lives in arch/riscv/boot/dts/sophgo/cv180x.dtsi
# and cv181x.dtsi and is shared by both architectures, so both families apply
# the very same kernel patch series (see patch/kernel/sophgo-sg200x-common).
#

declare -g ARCH="riscv64"
declare -g LINUXFAMILY="sophgo-sg200x-riscv64"
declare -g GOVERNOR="performance"

declare -g KERNEL_COMPILER="riscv64-linux-gnu-"

# Bootloader: none is built here.
#
# The SG200x BootROM loads fip.bin (FSBL + OpenSBI + U-Boot 2021.10) from the
# FAT partition at the start of the card. Mainline U-Boot has no SG2000 support,
# so Armbian ships a prebuilt vendor blob instead; the sophgo-fip-blobs
# extension drops it into the boot partition.
declare -g BOOTCONFIG="none"
declare -g ATFSOURCE="none"

# That vendor U-Boot is patched for distroboot, so it finds and parses
# /extlinux/extlinux.conf on the first bootable partition by itself.
declare -g SRC_EXTLINUX="yes"

# Kernel: mainline plus the out-of-tree Sophgo patch series.
case "${BRANCH}" in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.0"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-edge"
		# CV1800B DMA support is not upstream until 7.1; backport it here.
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-dmac-7.0"
		;;

	bleedingedge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-bleedingedge"
		declare -g KERNELPATCHDIR="sophgo-sg200x-common"
		;;

esac

# The AIC8800 Wi-Fi module is handled by the sophgo-aic8800 extension, and
# 512MB of RAM does not leave room to build the rest of Armbian's WiFi drivers.
declare -g EXTRAWIFI="no"

declare -g SERIALCON="ttyS0"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
