# Sophgo SG2000 / SG2002 (CV181x) family - ARM mode
#
# These SoCs pair an ARM Cortex-A53 with a T-Head C906 RISC-V core; which one
# runs Linux is decided by the FSBL inside fip.bin, not by anything Linux does.
# This family covers the ARM side. For RISC-V mode see sophgo-sg200x-riscv64.conf.
#
# Nearly everything is shared with that family and lives in
# include/sophgo-sg200x_family.inc - kernel branches and patch series, the
# U-Boot and FSBL pins, the chip-level SOPHGO_CVI_* settings. What is left here
# is what genuinely differs on the ARM side: the vendor SDK project naming and
# where U-Boot keeps its device trees.
#
# ARCH needs no KERNEL_COMPILER: aarch64 is Armbian's default cross toolchain.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="sophgo-sg200x-arm64"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_family.inc"

# The ARM half of the vendored duo-buildroot-sdk-v2 board files; the rest of the
# SOPHGO_CVI_* set is in the family include.
declare -g SOPHGO_CVI_PROJECT="sg2000_milkv_duos_glibc_arm64_sd"
declare -g SOPHGO_CVI_BOARD="milkv_duos_glibc_arm64_sd"
declare -g SOPHGO_CVI_FILES_VARIANT="arm64"
# U-Boot 2021.10 has no arch/arm64; aarch64 boards live under arch/arm.
declare -g SOPHGO_CVI_UBOOT_DTS_DIR="arch/arm/dts"
declare -g SOPHGO_CVI_UBOOT_ARCH="arm64"
# Also selects the prebuilt bl31.bin from inside the FSBL tree for fip.bin's
# monitor slot, where RISC-V builds OpenSBI.
declare -g SOPHGO_FSBL_ARCH="arm64"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_uboot.inc"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
