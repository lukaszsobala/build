# Sophgo SG2000 / SG2002 (CV181x) family - ARM mode
#
# These SoCs pair an ARM Cortex-A53 with a T-Head C906 RISC-V core; which one
# runs Linux is decided by the FSBL inside fip.bin, not by anything Linux does.
# This family covers the ARM side. For RISC-V mode see sophgo-sg200x-riscv64.conf.
#
# arch/arm64/boot/dts/sophgo/sg2000.dtsi #includes cv180x.dtsi and cv181x.dtsi
# straight out of arch/riscv, redefining SOC_PERIPHERAL_IRQ() to emit GIC_SPI
# specifiers. The whole SoC description is therefore shared, and so is the
# kernel patch series - arm64 just adds its own board DTS on top.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="sophgo-sg200x-arm64"
declare -g GOVERNOR="performance"

# Bootloader: none is built here. See sophgo-sg200x-riscv64.conf for the
# reasoning; note that no distroboot-enabled ARM fip.bin is published upstream,
# so one has to be built from the vendor SDK. See
# packages/blobs/sophgo/milkv-duos/README.md.
declare -g BOOTCONFIG="none"
declare -g ATFSOURCE="none"

declare -g SRC_EXTLINUX="yes"

case "${BRANCH}" in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.0"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-edge"
		# CV1800B DMA support is not upstream until 7.1; backport it here.
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-dmac-7.0 sophgo-sg200x-arm64"
		;;

	bleedingedge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-bleedingedge"
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-arm64"
		;;

esac

declare -g EXTRAWIFI="no"

declare -g SERIALCON="ttyS0"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
