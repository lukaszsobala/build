# Sophgo SG2000 / SG2002 (CV181x) family - ARM mode
#
# These SoCs pair an ARM Cortex-A53 with a T-Head C906 RISC-V core; which one
# runs Linux is decided by the FSBL inside fip.bin, not by anything Linux does.
# This family covers the ARM side. For RISC-V mode see sophgo-sg200x-riscv64.conf.
#
# arch/arm64/boot/dts/sophgo/sg2000.dtsi #includes cv180x.dtsi and cv181x.dtsi
# straight out of arch/riscv, redefining SOC_PERIPHERAL_IRQ() to emit GIC_SPI
# specifiers. The whole SoC description is therefore shared, and so is the
# kernel patch series - arm64 just adds its own board DTS on top.
#
# The bootloader is not shared: this family builds its own fip.bin from the
# vendor U-Boot and FSBL, while the RISC-V one still uses a prebuilt blob.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="sophgo-sg200x-arm64"
declare -g GOVERNOR="performance"

# Bootloader: built from source, unlike the RISC-V family which still uses a
# prebuilt blob. No distroboot-enabled ARM fip.bin is published anywhere, so
# there is nothing to ship even if we wanted to.
#
# The BootROM only loads fip.bin, so mainline U-Boot is not an option here: it
# has no ARM Sophgo support at all. We build the vendor U-Boot 2021.10 and let
# the vendor FSBL pack it into fip.bin. Details in the include below.
declare -g BOOTSOURCE="https://github.com/sophgo/u-boot-2021.10"
declare -g BOOTDIR="u-boot-sophgo-sg200x"
declare -g BOOTBRANCH="commit:bb7496c2dfded43921695bf49c23da28381f8960" # sg200x-dev, 2026-06-30
declare -g BOOTPATCHDIR="u-boot-sophgo-sg200x"

# The FSBL consumes u-boot.bin, so it cannot be built by compile_atf() - that
# runs before u-boot. It is built from uboot_custom_postprocess() instead.
declare -g ATFSOURCE="none"

declare -g SRC_EXTLINUX="yes"

# Identifies the duo-buildroot-sdk-v2 project whose board files we vendored.
# See packages/sophgo-sg200x/u-boot/README.md.
declare -g SOPHGO_CVI_PROJECT="sg2000_milkv_duos_glibc_arm64_sd"
declare -g SOPHGO_CVI_BOARD="milkv_duos_glibc_arm64_sd"
declare -g SOPHGO_CVI_CHIP="sg2000"
declare -g SOPHGO_CVI_CHIP_ARCH="CV181X"
declare -g SOPHGO_CVI_DDR_CFG="ddr3_1866_x16"
declare -g SOPHGO_CVI_STORAGE="sd"
declare -g SOPHGO_CVI_PANEL="MIPI_panel_milkv_8hd"
declare -g SOPHGO_CVI_FILES_VARIANT="arm64"
# U-Boot 2021.10 has no arch/arm64; aarch64 boards live under arch/arm.
declare -g SOPHGO_CVI_UBOOT_DTS_DIR="arch/arm/dts"
declare -g SOPHGO_CVI_UBOOT_ARCH="arm64"
declare -g SOPHGO_FSBL_ARCH="arm64"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_uboot.inc"

case "${BRANCH}" in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.0"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-edge"
		# CV1800B DMA support is not upstream until 7.1; backport it here.
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-dmac-7.0 sophgo-sg200x-arm64"
		;;

	bleedingedge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-bleedingedge"
		declare -g KERNELPATCHDIR="sophgo-sg200x-common sophgo-sg200x-arm64"
		;;

esac

declare -g EXTRAWIFI="no"

declare -g SERIALCON="ttyS0"

# shellcheck source=/dev/null
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
