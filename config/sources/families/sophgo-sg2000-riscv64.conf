# Sophgo SG2000/SG2002/CV1812H family - RISC-V mode
#
# These are dual-architecture chips (RISC-V or ARM Cortex-A53, selectable via hardware switch)
# This family configuration is for RISC-V mode (T-Head C906 core).
# For ARM64 mode, see sophgo-sg2000-arm64.conf
#

declare -g ARCH="riscv64"
declare -g LINUXFAMILY="sophgo-sg2000-riscv64"
declare -g GOVERNOR="performance"

# RISC-V compiler
declare -g KERNEL_COMPILER="riscv64-linux-gnu-"
declare -g UBOOT_COMPILER="riscv64-linux-gnu-"

# Boot configuration
# The vendor U-Boot uses FIT images and extlinux
# OpenSBI is used for RISC-V boot (vendor provides pre-built OpenSBI+U-Boot)
declare -g SRC_EXTLINUX="yes"

# U-Boot - Skip compilation, use vendor bootloader from SD card
# Mainline U-Boot doesn't yet support SG2000 RISC-V mode
# The vendor bootloader (with OpenSBI) must be pre-installed on the SD card
# or flashed from the official Milkv Duo S SD card image
declare -g BOOTCONFIG="none"

# ATF/OpenSBI - not needed, vendor provides pre-built
declare -g ATFSOURCE="none"

# Kernel
case "${BRANCH}" in

	current)
		# Mainline kernel 6.18 with Sophgo RISC-V support
		# Note: RISC-V support for SG2000 may be less mature than ARM64
		declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
		declare -g KERNELBRANCH="tag:v6.18"
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g LINUXCONFIG="linux-sophgo-sg2000-riscv64-current"
		declare -g KERNELPATCHDIR="sophgo-sg2000-riscv64-${BRANCH}"
		declare -g EXTRAWIFI="no" # Limited RAM, skip extra WiFi drivers
		;;

	edge)
		# Mainline kernel 6.19 (edge/release candidate)
		# Note: RISC-V support for SG2000 may be less mature than ARM64
		declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
		declare -g KERNELBRANCH="tag:v6.19-rc7"
		declare -g KERNEL_MAJOR_MINOR="6.19"
		declare -g LINUXCONFIG="linux-sophgo-sg2000-riscv64-edge"
		declare -g KERNELPATCHDIR="sophgo-sg2000-riscv64-${BRANCH}"
		declare -g EXTRAWIFI="no" # Limited RAM, skip extra WiFi drivers
		;;

esac

# Default serial console
declare -g SERIALCON="ttyS0"

# Image settings
# The SG2000 uses a specific partition layout with vendor boot loader
# The boot partition must start at sector 1 (immediately after MBR) and contain fip.bin as a file
function pre_prepare_partitions() {
	declare -g OFFSET="1" # Minimal offset (will be overridden by custom partitioning)
	declare -g IMAGE_PARTITION_TABLE="msdos"
	declare -g BOOTSIZE="128" # Match official image size
	declare -g USE_HOOK_FOR_PARTITION="yes" # Use custom partition table
}

# Custom partition table for Sophgo SG2000
# Boot partition MUST start at sector 1 for the bootrom to find fip.bin
function create_partition_table__sophgo_sg2000() {
	display_alert "Creating Sophgo partition table" "boot at sector 1" "info"
	# Partition 1: Boot (FAT16) starting at sector 1, 128MB
	# Partition 2: Root (ext4) starting after boot
	local boot_sectors=$((128 * 2048)) # 128MB in sectors
	local boot_end=$((1 + boot_sectors - 1))
	local root_start=$((boot_end + 1))

	# Create partition table with boot at sector 1
	echo "start=1, size=${boot_sectors}, type=c, bootable" | \
		run_host_command_logged sfdisk --append "${SDCARD}".raw || exit_with_error "Failed to create boot partition"
	echo "start=${root_start}, type=83" | \
		run_host_command_logged sfdisk --append "${SDCARD}".raw || exit_with_error "Failed to create root partition"
}

# Sophgo bootrom reads fip.bin from FAT boot partition (not raw sectors)
# The fip.bin is copied to boot partition by the sophgo-fip-blobs extension
# This function is intentionally empty - no raw sector writes needed
function write_uboot_platform() {
	# Sophgo SG2000 loads fip.bin from FAT filesystem, not raw sectors
	# The sophgo-fip-blobs extension handles copying fip.bin to /boot
	return 0
}

# Post family configuration tweaks
function post_family_config__sophgo_sg2000_riscv64() {
	display_alert "Sophgo SG2000 RISC-V" "Applying family configuration" "info"
}

# Custom kernel config function
function custom_kernel_config__sophgo_sg2000_riscv64_kernel() {
	if [[ -f .config ]]; then
		display_alert "Sophgo SG2000 RISC-V" "Customizing kernel config" "info"

		# Enable Sophgo SoC support (RISC-V platform)
		kernel_config_set_y CONFIG_SOC_SOPHGO

		# Enable T-Head C906 specific options
		kernel_config_set_y CONFIG_ERRATA_THEAD

		# Enable required drivers for SG2000
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_CV1800B
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_CV1812H
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_SG2000
		kernel_config_set_y CONFIG_PINCTRL_SOPHGO_SG2002

		# Clock driver
		kernel_config_set_y CONFIG_CLK_SOPHGO_CV1800

		# DMA
		kernel_config_set_y CONFIG_DW_AXI_DMAC
		kernel_config_set_y CONFIG_SOPHGO_CV1800B_DMAMUX

		# Ethernet
		kernel_config_set_y CONFIG_STMMAC_ETH
		kernel_config_set_y CONFIG_STMMAC_PLATFORM
		kernel_config_set_y CONFIG_DWMAC_SOPHGO

		# Serial
		kernel_config_set_y CONFIG_SERIAL_8250
		kernel_config_set_y CONFIG_SERIAL_8250_CONSOLE
		kernel_config_set_y CONFIG_SERIAL_8250_DW

		# MMC/SD
		kernel_config_set_y CONFIG_MMC
		kernel_config_set_y CONFIG_MMC_SDHCI
		kernel_config_set_y CONFIG_MMC_SDHCI_PLTFM
		kernel_config_set_y CONFIG_MMC_CQHCI

		# GPIO
		kernel_config_set_y CONFIG_GPIO_DWAPB

		# I2C
		kernel_config_set_y CONFIG_I2C_DESIGNWARE_PLATFORM

		# SPI
		kernel_config_set_y CONFIG_SPI_DESIGNWARE
		kernel_config_set_y CONFIG_SPI_DW_MMIO

		# RTC
		kernel_config_set_y CONFIG_RTC_DRV_CV1800

		# ADC
		kernel_config_set_y CONFIG_SOPHGO_CV1800B_ADC

		# Sophgo SoC specific
		kernel_config_set_y CONFIG_SOPHGO_CV1800_RTCSYS

		# USB
		kernel_config_set_y CONFIG_USB_DWC2
		kernel_config_set_y CONFIG_USB_DWC2_DUAL_ROLE

		# Mailbox
		kernel_config_set_y CONFIG_CV1800_MBOX

		# Module support (required for Armbian packaging)
		kernel_config_set_y CONFIG_MODULES
	fi
}

# Kernel helpers
function kernel_config_set_y() {
	local option="$1"
	if grep -q "^# ${option} is not set" .config 2>/dev/null; then
		sed -i "s/^# ${option} is not set/${option}=y/" .config
	elif ! grep -q "^${option}=" .config 2>/dev/null; then
		echo "${option}=y" >> .config
	fi
}

function kernel_config_set_n() {
	local option="$1"
	if grep -q "^${option}=" .config 2>/dev/null; then
		sed -i "s/^${option}=.*$/# ${option} is not set/" .config
	fi
}
